<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GuaMaps Tenerife</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&display=swap" rel="stylesheet">
<style>
:root{--bg:#EAF2F6;--paper:#fff;--ink:#0F2a3d;--muted:#56707F;--line:#D3E1E8;--ocean:#0D5C8C;--ocean2:#DCEBF3;--sun:#F4BE3A;--laurel:#2F6B4F;--fs:16px;--head:"Bricolage Grotesque",system-ui,sans-serif}
[data-theme=dark]{--bg:#071423;--paper:#0E2236;--ink:#E5EFF5;--muted:#8DA7B8;--line:#1D3A54;--ocean:#5DB7E6;--ocean2:#12314C}
[data-contrast=high]{--ink:#000;--muted:#1a1a1a;--line:#000;--ocean:#00406A;--ocean2:#cfe3ef}
[data-theme=dark][data-contrast=high]{--ink:#fff;--muted:#f0f0f0;--line:#fff;--ocean:#8fd8ff;--ocean2:#0b2a44}
[data-large=on]{--fs:19px}
*{box-sizing:border-box}
body{margin:0;font:400 var(--fs)/1.5 var(--head);font-optical-sizing:auto;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.app{max-width:560px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
.app>nav{order:3}.app>main{order:2}
.top{display:flex;align-items:center;gap:8px;padding:14px 18px 10px}
.mark{display:flex;align-items:center;gap:8px;font-weight:800;font-size:1.25em;letter-spacing:-.02em;color:var(--ocean)}
.mark svg{width:28px;height:28px}
.top select{margin-left:auto;background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:6px 10px;font-size:.85em;font-weight:600}
main{flex:1;padding:0 14px 28px}
.ic{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* Hero */
.hero{position:relative;height:250px;margin-bottom:46px}
.hero .skybox{position:absolute;inset:0;border-radius:26px;overflow:hidden}
.hero svg.sky{position:absolute;inset:0;width:100%;height:100%}
.hero .searchwrap{z-index:3}
.hero .hi{position:absolute;left:22px;top:20px;right:22px}
.hero .greet{font-size:1em;font-weight:600;opacity:.9}
.hero .clock{font-size:3.6em;font-weight:800;letter-spacing:-.04em;line-height:1;font-variant-numeric:tabular-nums}
.hero .where{font-size:1.1em;font-weight:500;margin-top:4px}
.hero.light{color:#0C2738}.hero.dark{color:#fff;text-shadow:0 1px 12px rgba(0,0,0,.35)}
.hero .searchwrap{position:absolute;left:14px;right:14px;bottom:-26px}
.search{display:flex;align-items:center;gap:10px;background:var(--paper);border-radius:16px;padding:0 14px;box-shadow:0 10px 30px -12px rgba(13,60,92,.45);border:1px solid var(--line)}
.search input{flex:1;border:0;background:none;padding:15px 0;outline:none;font-size:1em}
.search .ic{color:var(--muted)}

/* Common */
h1{font-size:2em;font-weight:800;letter-spacing:-.035em;line-height:1.05;margin:10px 4px 4px}
.sub{color:var(--muted);margin:0 4px 16px}
h3{font-size:1em;font-weight:700;margin:22px 4px 10px}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:6px 16px;margin-bottom:12px}
.muted{color:var(--muted);font-size:.88em}
.row{display:flex;align-items:center;gap:12px}
.grow{flex:1;min-width:0}
.trunc{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:14px;padding:12px 16px;background:var(--ocean);color:#fff;font-weight:700;cursor:pointer}
[data-theme=dark] .btn{color:#05182a}
.btn.soft{background:var(--ocean2);color:var(--ocean)}
.btn .ic{width:20px;height:20px}
.round{border:1px solid var(--line);background:var(--paper);border-radius:50%;width:44px;height:44px;display:grid;place-items:center;cursor:pointer;flex:none}
.round.on{background:var(--sun);border-color:var(--sun);color:#3a2a00}
.round .ic{width:20px;height:20px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px;scrollbar-width:none}
.chips.wrap{flex-wrap:wrap;overflow:visible}
.chip{flex:none;border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:7px 14px;font-size:.88em;font-weight:600;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.badge{display:inline-grid;place-items:center;min-width:46px;height:32px;padding:0 7px;border-radius:9px;font-weight:800;font-size:.95em;flex:none;letter-spacing:-.01em;box-shadow:inset 0 -3px 0 rgba(0,0,0,.12)}
.badge.sm{min-width:38px;height:26px;font-size:.82em;border-radius:7px}
.code{font-size:.75em;font-weight:600;background:var(--ocean2);color:var(--ocean);border-radius:6px;padding:1px 7px;white-space:nowrap;font-variant-numeric:tabular-nums}
.empty{color:var(--muted);text-align:center;padding:22px 10px}
.note{background:#FFF4D2;color:#5a4300;border-radius:14px;padding:12px 14px;margin-bottom:12px;font-size:.92em}
[data-theme=dark] .note{background:#3a300f;color:#ffe9a8}

/* Results dropdown */
.results{background:var(--paper);border:1px solid var(--line);border-radius:16px;margin:8px 0 0;max-height:320px;overflow:auto;box-shadow:0 14px 30px -18px rgba(13,60,92,.5)}
.res{padding:11px 14px;border-bottom:1px solid var(--line);cursor:pointer;display:flex;gap:10px;align-items:center}
.res:last-child{border:0}.res:hover{background:var(--ocean2)}

/* Stop + departures */
.stophead{display:flex;align-items:center;gap:12px;margin:4px 4px 12px}
.stophead b{font-size:1.45em;font-weight:800;letter-spacing:-.03em;line-height:1.1;display:block}
.dep{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.dep:last-child{border:0}
.dep .when{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.dep .when b{font-size:1.35em;font-weight:800;letter-spacing:-.02em}
.dep .when small{font-size:.75em;color:var(--muted);margin-left:2px}
.dep.first{padding:16px 0}
.dep.first .when b{font-size:2em}
.live{display:inline-block;width:8px;height:8px;border-radius:50%;background:#2DBE6C;margin-right:6px;vertical-align:middle;animation:pulse 1.6s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(45,190,108,.6)}100%{box-shadow:0 0 0 10px rgba(45,190,108,0)}}
.quick{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.quick button{text-align:left;background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:12px 14px;cursor:pointer;font-weight:700;line-height:1.25}
.quick button small{display:block;font-weight:500;color:var(--muted);font-size:.78em;margin-top:2px}

/* Planner */
.fields{position:relative;padding:12px 0 12px 30px}
.fields:before{content:"";position:absolute;left:9px;top:32px;bottom:32px;border-left:2px dashed var(--line)}
.field{position:relative;padding:6px 56px 6px 0}
.field .dot{position:absolute;left:-28px;top:16px;width:14px;height:14px;border-radius:50%;border:3px solid var(--ocean);background:var(--paper)}
.field.to .dot{background:var(--sun);border-color:var(--sun)}
.field label{font-size:.78em;font-weight:700;color:var(--muted)}
.field .val{font-weight:700;padding:4px 0}
.field input{width:100%;border:0;border-bottom:2px solid var(--line);background:none;padding:6px 0;outline:none}
.field input:focus{border-color:var(--ocean)}
.mini{border:0;background:var(--ocean2);color:var(--ocean);border-radius:50%;width:30px;height:30px;display:grid;place-items:center;cursor:pointer;flex:none}.mini .ic{width:16px;height:16px}
.swap{position:absolute;right:0;top:50%;transform:translateY(-50%)}
.trip{padding:14px 0;border-bottom:1px solid var(--line)}
.trip:last-child{border:0}
.trip .tt{font-size:1.5em;font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.tl{margin:12px 0 4px 6px}
.lg{position:relative;padding:0 0 12px 22px;border-left:4px solid var(--c,var(--line))}
.lg.walk{border-left:3px dotted var(--muted);margin-left:1px}
.lg:last-child{padding-bottom:0}
.lg:before{content:"";position:absolute;left:-8px;top:2px;width:12px;height:12px;border-radius:50%;background:var(--paper);border:3px solid var(--c,var(--muted))}
.lg .t{font-weight:800;font-variant-numeric:tabular-nums;margin-right:6px}
.eco{display:inline-block;background:#E3F3EA;color:#1F5A3E;border-radius:999px;padding:4px 11px;font-size:.8em;font-weight:600;margin-top:8px}
[data-theme=dark] .eco{background:#123526;color:#9be0bd}

/* Places */
.place{background:var(--paper);border:1px solid var(--line);border-radius:22px;overflow:hidden;margin-bottom:14px}
.place .art{position:relative;height:128px}
.place .art svg{position:absolute;inset:0;width:100%;height:100%}
.place .art h2{position:absolute;left:16px;right:16px;bottom:10px;margin:0;color:#fff;font-size:1.35em;font-weight:800;letter-spacing:-.025em;line-height:1.1;text-shadow:0 1px 10px rgba(0,0,0,.35)}
.place .body{padding:12px 16px 16px}
.place p{margin:0 0 12px}
.tag{font-size:.75em;font-weight:700;border-radius:999px;padding:3px 10px;background:var(--ocean2);color:var(--ocean)}
.buses{display:flex;flex-wrap:wrap;gap:5px;margin:6px 0 12px}

/* Lines */
.lrow{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);cursor:pointer}
.lrow:last-child{border:0}
.lhead{border-radius:22px;padding:18px;color:#fff;margin-bottom:12px}
.lhead b{display:block;font-size:1.35em;font-weight:800;letter-spacing:-.025em;line-height:1.15;margin-top:8px}
.times{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 6px}
.times span{font-variant-numeric:tabular-nums;font-size:.85em;font-weight:600;background:var(--ocean2);color:var(--ocean);border-radius:8px;padding:3px 8px}
.times span.past{background:none;color:var(--muted);opacity:.55}
.seq{margin:12px 0 6px 8px;border-left:4px solid}
.seq div{position:relative;padding:6px 0 6px 18px;cursor:pointer}
.seq div:before{content:"";position:absolute;left:-9px;top:12px;width:10px;height:10px;border-radius:50%;background:var(--paper);border:3px solid currentColor}
.seq div:first-child:before,.seq div:last-child:before{width:14px;height:14px;left:-11px;top:10px;background:currentColor}

/* Settings */
.set{display:flex;justify-content:space-between;align-items:center;padding:13px 0;border-bottom:1px solid var(--line)}
.set:last-child{border:0}
.sw{width:50px;height:30px;border-radius:999px;background:var(--line);border:0;position:relative;cursor:pointer;flex:none}
.sw:after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:left .15s;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.sw.on{background:var(--ocean)}.sw.on:after{left:23px}

/* Nav */
nav{position:sticky;bottom:0;display:grid;grid-template-columns:repeat(5,1fr);background:color-mix(in srgb,var(--paper) 92%,transparent);backdrop-filter:blur(10px);border-top:1px solid var(--line);z-index:5;padding:6px 6px 8px}
nav button{background:none;border:0;padding:6px 2px;color:var(--muted);font-size:.7em;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;border-radius:14px}
nav button.on{color:var(--ocean);background:var(--ocean2)}
.foot{font-size:.74em;color:var(--muted);text-align:center;margin-top:20px;padding:0 10px}

.deskonly{display:none}
@media (min-width:900px){
 .app{max-width:1240px}
 .top{padding:18px 28px 8px}
 .app>nav{order:1} .app>main{order:2}
 .colL .chips{flex-wrap:wrap;overflow:visible}
 nav{position:sticky;top:0;bottom:auto;display:flex;justify-content:center;gap:6px;border:0;border-bottom:1px solid var(--line);padding:8px 28px;margin-bottom:18px}
 nav button{flex-direction:row;font-size:.92em;padding:9px 16px;gap:8px}
 main{padding:0 28px 40px}
 .hero{height:340px;margin-bottom:56px}
 .hero .hi{left:40px;top:34px}
 .hero .clock{font-size:5em}
 .hero .searchwrap{left:40px;right:auto;width:min(560px,60%)}
 h1{font-size:2.6em;margin-top:6px}
 .sub{max-width:62ch}
 .cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);gap:28px;align-items:start}
 .cols.plan{grid-template-columns:minmax(0,.9fr) minmax(0,1.3fr)}
 .cols .colL{position:sticky;top:76px}
 .deskonly{display:block;margin-top:22px}
 .quick{grid-template-columns:repeat(3,1fr)}
 .pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:18px}
 .pgrid .place{margin:0}
 #llist{columns:2;column-gap:28px}
 #llist .lrow{break-inside:avoid}
 .foot{margin-top:32px}
}
@media (prefers-reduced-motion:reduce){.live{animation:none}.sw:after{transition:none}}
</style>

RT.forEach(R=>R.k+=' '+norm((R.pats||[]).map(p=>p.h).join(' ')));

 ST.forEach(s=>{const k=key(Math.floor(s.la*300),Math.floor(s.lo*300));(g.get(k)||g.set(k,[]).get(k)).push(s)});
 ST.forEach(s=>{const a=Math.floor(s.la*300),b=Math.floor(s.lo*300);for(let x=-1;x<=1;x++)for(let y=-1;y<=1;y++)for(const o of g.get(key(a+x,b+y))||[]){if(o===s)continue;const d=Math.hypot((o.la-s.la)*110540,(o.lo-s.lo)*111320*c);if(d<=300)NB[s.i].push([o.i,Math.max(1,Math.ceil(d*1.3/75))])}})})();

  else{h+=`<div class="panel">${S.res.map(r=>{const bus=r.legs.filter(l=>!l.walk),ride=bus.reduce((s,l)=>s+l.arr-l.dep,0);
   return `<div class="trip"><div class="row"><div class="grow"><div class="tt">${fmt(r.dep)} – ${fmt(r.arr)}</div><div class="muted">${bus.length>1?t('transfers',{n:bus.length-1}):t('direct')}, ${t('dur',{n:Math.round(r.arr-r.dep)})}</div></div><div class="row" style="gap:4px">${bus.map(l=>badge(l.R,1)).join('')}</div></div>
   <div class="tl">${r.legs.map(l=>l.walk?`<div class="lg walk"><span class="muted">${t('walk',{n:l.walk,s:esc(ST[l.to].n)})}</span></div>`:`<div class="lg" style="--c:${l.R.c}"><div><span class="t">${fmt(l.dep)}</span>${stopLabel(l.from)}</div><div class="muted" style="margin:3px 0">${badge(l.R,1)} ${t('towards')} ${esc(l.P.h)}</div><div><span class="t">${fmt(l.arr)}</span>${stopLabel(l.to)}</div></div>`).join('')}</div>
   <span class="eco">${t('co2',{n:(ride*0.6*0.09).toFixed(1)})}</span></div>`}).join('')}</div>
   <button class="btn soft" style="width:100%" data-act="later">${icon('clock')} ${t('more')}</button>`}}
 return h+`</div></div>`},

places(){const tags=['all','pareja','grupo','sunset','nat','playa','cultura','ocio'];const L=PLACES.filter(p=>S.ptag==='all'||p.tg.includes(S.ptag));
 return `<h1>${t('placesTitle')}</h1><p class="sub">${t('placesSub')}</p><div class="chips" style="margin-bottom:12px">${tags.map(g=>`<button class="chip${S.ptag===g?' on':''}" data-act="ptag" data-v="${g}">${t(g==='all'?'pAll':g)}</button>`).join('')}</div>
 <div class="pgrid">${L.map(p=>`<article class="place"><div class="art">${art(p,PLACES.indexOf(p))}<h2>${esc(p.n)}</h2></div><div class="body">
 <div class="chips wrap" style="margin-bottom:8px">${p.tg.map(g=>`<span class="tag">${t(g)}</span>`).join('')}</div>
 <p>${p.d[S.lang]||p.d.es}</p>
 <div class="muted">${t('busesHere')}: ${stopLabel(p.si)}</div><div class="buses">${p.R.slice(0,12).map(R=>badge(R,1)).join('')}</div>
 <div class="row"><button class="btn grow" data-act="howto" data-v="${p.si}">${icon('route')} ${t('howTo')}</button><button class="btn soft grow" data-act="stop" data-v="${p.si}">${icon('clock')} ${t('seeStop')}</button></div></div></article>`).join('')}</div>`},

lines(){if(S.line!=null)return lineDetail(RT[S.line]);
 return `<h1>${t('lines')}</h1><p class="sub">${t('linesSub',{n:ROUTES.length})}</p><label class="search" style="margin-bottom:12px">${icon('search')}<input id="lq" placeholder="${t('searchLine')}" value="${esc(S.lq)}" autocomplete="off"></label><div class="panel" id="llist">${lineList(S.lq)}</div>`},

settings(){const sw=(k,on)=>`<div class="set"><span>${t(k)}</span><button class="sw${on?' on':''}" data-act="tog" data-v="${k}" aria-pressed="${on}" aria-label="${t(k)}"></button></div>`;
 return `<h1>${t('settings')}</h1><h3>${t('language')}</h3><div class="chips wrap">${[['es','Español'],['en','English'],['de','Deutsch'],['fr','Français'],['it','Italiano']].map(([c,n])=>`<button class="chip${S.lang===c?' on':''}" data-act="lang" data-v="${c}">${n}</button>`).join('')}</div>
 <h3>${t('appearance')}</h3><div class="panel">${sw('dark',S.dark)}${sw('large',S.large)}${sw('contrast',S.contrast)}</div>
 <h3>${t('about')}</h3><div class="panel" style="padding:14px 16px"><p style="margin:0 0 8px">${t('aboutTxt')}</p><p class="muted" style="margin:0">${t('data',{a:dateStr(0),b:dateStr(DATA.n-1)})}</p></div>`}
};

function lineList(q){const w=norm(q).trim().split(/\s+/).filter(Boolean);const L=ROUTES.filter(R=>w.every(x=>R.k.includes(x)));
 return L.map(R=>`<div class="lrow" data-act="line" data-v="${R.i}">${badge(R)}<div class="grow" style="font-weight:600;line-height:1.3">${esc(R.ln)}</div>${icon('go')}</div>`).join('')||`<div class="empty">${t('noLines')}</div>`}

function lineDetail(R){const by=new Map();for(const P of R.pats){(by.get(P.h)||by.set(P.h,[]).get(P.h)).push(P)}
 const heads=[...by.keys()];if(S.pat==null||!heads.includes(S.pat))S.pat=heads[0];
 const group=by.get(S.pat),main=group.reduce((a,b)=>b.tr.length>a.tr.length?b:a);
 const {day,min}=now(),times=[];for(const P of group)for(const tr of P.tr)if(runs(tr[2],day))times.push(tr[0]);times.sort((a,b)=>a-b);
 return `<button class="btn soft" data-act="back" style="margin:8px 0 12px">${icon('back')} ${t('lines')}</button>
 <div class="lhead" style="background:${R.c};color:${R.tc}"><span class="badge" style="background:rgba(255,255,255,.35);color:${R.tc}">${esc(R.sn)}</span><b>${esc(R.ln)}</b></div>
 <h3>${t('dir')}</h3><div class="chips wrap">${heads.map(h=>`<button class="chip${h===S.pat?' on':''}" data-act="pat" data-v="${esc(h)}">${t('towards')} ${esc(h)}</button>`).join('')}</div>
 <div class="cols"><div class="colL"><h3>${t('today',{s:esc(ST[main.s[0]].n)})}</h3><div class="panel" style="padding:8px 14px">${times.length?`<div class="times">${[...new Set(times)].map(x=>`<span class="${x<min-1?'past':''}">${fmt(x)}</span>`).join('')}</div>`:`<div class="empty">${t('noToday')}</div>`}</div>
 </div><div class="colR"><h3>${t('stopsN',{n:main.s.length})}</h3><div class="panel"><div class="seq" style="border-color:${R.c};color:${R.c}">${main.s.map((s,i)=>`<div data-act="stop" data-v="${s}" style="color:var(--ink)">${esc(ST[s].n)} <span class="code">${ST[s].id}</span> <span class="muted">+${Math.round(main.o[i])} ${t('min')}</span></div>`).join('')}</div></div></div></div>`}

/* ---------- Render y eventos ---------- */
const TABS=[['home','stop'],['plan','route'],['places','pin'],['lines','bus'],['settings','gear']];
function render(){const r=document.documentElement;r.lang=S.lang;r.dataset.theme=S.dark?'dark':'light';r.dataset.contrast=S.contrast?'high':'normal';r.dataset.large=S.large?'on':'off';
 document.getElementById('langSel').value=S.lang;
 document.getElementById('nav').innerHTML=TABS.map(([k,i])=>`<button class="${S.tab===k?'on':''}" data-act="tab" data-v="${k}" aria-current="${S.tab===k}">${icon(i)}${t(k)}</button>`).join('');
 document.getElementById('main').innerHTML=V[S.tab]()+`<div class="foot">${t('data',{a:dateStr(0),b:dateStr(DATA.n-1)})}</div>`;}

document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el)return;const a=el.dataset.act,v=el.dataset.v;
 if(a==='tab'){S.tab=v;window.scrollTo(0,0)}
 else if(a==='stop'){S.stop=+v;S.q='';S.filter=null;S.tab='home';store.set('stop',S.stop);window.scrollTo(0,0)}
 else if(a==='fav'){S.favs=S.favs.includes(S.stop)?S.favs.filter(f=>f!==S.stop):[...S.favs,S.stop];store.set('favs',S.favs)}
 else if(a==='filter'){S.filter=v===''?null:+v}
 else if(a==='from'){S.from=+v;S.fq='';S.res=null}
 else if(a==='to'){S.to=+v;S.tq='';S.res=null}
 else if(a==='clr'){S[v]=null;S.res=null}
 else if(a==='swap'){[S.from,S.to]=[S.to,S.from];S.res=null}
 else if(a==='go'){runPlan()}
 else if(a==='later'){S.res=plan(Math.max(...S.res.map(r=>r.dep))+1)}
 else if(a==='line'){S.line=+v;S.pat=null;window.scrollTo(0,0)}
 else if(a==='pat'){S.pat=v}
 else if(a==='ptag'){S.ptag=v}
 else if(a==='howto'){S.to=+v;S.tq='';if(S.from!=null&&S.from!==S.to)runPlan();else S.res=null;S.tab='plan';window.scrollTo(0,0)}
 else if(a==='back'){S.line=null}
 else if(a==='lang'){S.lang=v;store.set('lang',v)}
 else if(a==='tog'){S[v]=!S[v];store.set(v,S[v])}
 render()});
document.addEventListener('input',e=>{const id=e.target.id,v=e.target.value;
 if(id==='q'){S.q=v;document.getElementById('qres').innerHTML=resList(findStops(v),'stop')}
 if(id==='fq'){S.fq=v;document.getElementById('fqres').innerHTML=resList(findStops(v),'from')}
 if(id==='tq'){S.tq=v;document.getElementById('tqres').innerHTML=resList(findStops(v),'to')}
 if(id==='lq'){S.lq=v;document.getElementById('llist').innerHTML=lineList(v)}});
document.getElementById('langSel').addEventListener('change',e=>{S.lang=e.target.value;store.set('lang',S.lang);render()});
let _wide=window.innerWidth>=900;window.addEventListener('resize',()=>{const w=window.innerWidth>=900;if(w!==_wide){_wide=w;const a=document.activeElement;if(!(a&&a.tagName==='INPUT'))render()}});
setInterval(()=>{const a=document.activeElement;if(S.tab==='home'&&!(a&&a.tagName==='INPUT'))render()},30000);
render();
</script>
</body>
</html>
